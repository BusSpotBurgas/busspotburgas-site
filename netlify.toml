[build]
  command = "npm run build"
  publish = ".next"
  # Пести кредити: ако в качването няма промени по самия сайт (само README, документи,
  # GitHub настройки, база, скриптове), Netlify не прави ново качване.
  # Внимание: промяна САМО в netlify.toml също се пропуска – качи я заедно с промяна в кода
  # или пусни ръчно Deploys → Trigger deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)docs' ':(exclude).github' ':(exclude).gitleaks.toml' ':(exclude)supabase' ':(exclude)scripts' ':(exclude)netlify.toml'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Service worker-ът не трябва да се кешира, за да идват обновленията веднага
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Основни защитни заглавия за всички страници
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
